apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: autonomous-ds
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
    scrape_configs:
      - job_name: "autonomous-ds-pods"
        kubernetes_sd_configs:
          - role: pod
            namespaces: { names: [autonomous-ds] }
        relabel_configs:
          # Only scrape pods with prometheus.io/scrape: "true" (set on every
          # service's Deployment template — see k8s/02-*.yaml onward)
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: service
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: autonomous-ds
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus
  namespace: autonomous-ds
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus
  namespace: autonomous-ds
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: autonomous-ds
roleRef: { kind: Role, name: prometheus, apiGroup: rbac.authorization.k8s.io }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: autonomous-ds
spec:
  replicas: 1
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args: ["--config.file=/etc/prometheus/prometheus.yml"]
          ports: [{ containerPort: 9090 }]
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: autonomous-ds
spec:
  selector: { app: prometheus }
  ports: [{ port: 9090, targetPort: 9090 }]

# Simple self-contained setup for one cluster. At real scale, swap this for
# the kube-prometheus-stack Helm chart (adds Grafana + alerting + longer
# retention) — nothing in the app changes, since services just expose
# /metrics regardless of who's scraping it.
