apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporting
  namespace: autonomous-ds
spec:
  replicas: 2
  selector:
    matchLabels: { app: reporting }
  template:
    metadata:
      labels: { app: reporting }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: reporting
          image: REGISTRY/ads-reporting:latest   # set by scripts/deploy.sh
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: ads-config }
          env:
            - name: MINIO_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: minio-credentials, key: access-key } }
            - name: MINIO_SECRET_KEY
              valueFrom: { secretKeyRef: { name: minio-credentials, key: secret-key } }
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef: { name: anthropic-credentials, key: api-key, optional: true }
            - name: HF_API_TOKEN
              valueFrom:
                secretKeyRef: { name: hf-credentials, key: api-token, optional: true }
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "1", memory: "1Gi" }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: reporting-svc
  namespace: autonomous-ds
spec:
  selector: { app: reporting }
  ports: [{ port: 8000, targetPort: 8000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: reporting-hpa
  namespace: autonomous-ds
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: reporting
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
