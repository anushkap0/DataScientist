apiVersion: apps/v1
kind: Deployment
metadata:
  name: evaluation
  namespace: autonomous-ds
spec:
  replicas: 1
  selector:
    matchLabels: { app: evaluation }
  template:
    metadata:
      labels: { app: evaluation }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: evaluation
          image: REGISTRY/ads-evaluation:latest   # set by scripts/deploy.sh
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: ads-config }
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "1", memory: "1Gi" }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: evaluation-svc
  namespace: autonomous-ds
spec:
  selector: { app: evaluation }
  ports: [{ port: 8000, targetPort: 8000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: evaluation-hpa
  namespace: autonomous-ds
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: evaluation
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
