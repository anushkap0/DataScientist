apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: autonomous-ds
spec:
  # NOTE: RUNS registry in orchestrator/app/main.py is in-memory, so this
  # stays at 1 replica until that state is moved to Redis/Postgres (see
  # README "Scaling further"). Every other service is fully horizontal.
  replicas: 1
  selector:
    matchLabels: { app: orchestrator }
  template:
    metadata:
      labels: { app: orchestrator }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: orchestrator
          image: REGISTRY/ads-orchestrator:latest   # set by scripts/deploy.sh
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: ads-config }
          env:
            - name: MINIO_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: minio-credentials, key: access-key } }
            - name: MINIO_SECRET_KEY
              valueFrom: { secretKeyRef: { name: minio-credentials, key: secret-key } }
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "1", memory: "1Gi" }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator-svc
  namespace: autonomous-ds
spec:
  selector: { app: orchestrator }
  ports: [{ port: 8000, targetPort: 8000 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ads-ingress
  namespace: autonomous-ds
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  ingressClassName: nginx
  rules:
    - host: autonomous-ds.local   # change to your real domain
      http:
        paths:
          - path: /(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: orchestrator-svc
                port: { number: 8000 }
